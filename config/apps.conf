# Configuración de Nex Setup para Arch Linux
#
# Formato:
#   [Categoría]
#   paquete | Nombre visible | origen | estado
#
#   origen: pacman (repos oficiales), aur (se instala yay si hace falta) o
#           hyde (ejecuta el instalador oficial de HyDE, solo en Arch real)
#   estado: on (marcado por defecto) u off (desmarcado)
#
# Para añadir una app, escribe una línea nueva dentro de su categoría.
# Las líneas que empiezan por # son comentarios.

[Gaming]
steam | Steam | pacman | off
lutris | Lutris | pacman | off
gamemode | GameMode | pacman | on
mangohud | MangoHud | pacman | off

[Multimedia]
vlc | VLC Player | pacman | on
mpv | mpv | pacman | off
obs-studio | OBS Studio | pacman | off
gimp | GIMP | pacman | off

[Internet]
firefox | Firefox | pacman | on
thunderbird | Thunderbird | pacman | off
qbittorrent | qBittorrent | pacman | off
brave-bin | Brave | aur | off
brave-origin-bin | Brave Origin | aur | off

[Varios]
7zip | 7-Zip | aur | off
octopi | Octopi (tienda gráfica de paquetes) | aur | off
p7zip | p7zip | pacman | on
unrar | UnRAR | pacman | on
keepassxc | KeePassXC | pacman | off
flameshot | Flameshot | pacman | on
btop | btop | pacman | on

[Escritorio]
# hyde instala los dotfiles HyDE (Hyprland) con su script oficial. Solo en Arch real.
hyde | HyDE (escritorio Hyprland, solo Arch real) | hyde | off

[IA]
ollama | Ollama | pacman | off
claude-code | Claude Code | aur | off
open-webui | Open WebUI | aur | off

[Desarrollo]
git | Git | pacman | on
code | Visual Studio Code (OSS) | pacman | off
docker | Docker | pacman | off
