# Tema Delta para Hyprland (generado por aplicar-tema.sh).
# Cambia los colores aquí y recarga Hyprland con: hyprctl reload

$fondo = rgb(__FONDO__)
$acento = rgb(__ACENTO__)

general {
    col.active_border = $acento
    col.inactive_border = $fondo
    gaps_out = 12
    border_size = 2
}

decoration {
    rounding = 10
}
