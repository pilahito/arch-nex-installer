# Tema Nex para Hyprland (generado por aplicar-tema.sh).
# Cambia los colores aquí y recarga la configuración con: hyprctl reload

# Barra superior con Waybar (reloj, CPU y RAM)
exec-once = waybar

$fondo = rgb(__FONDO__)
$acento = rgb(__ACENTO__)
$acento2 = rgb(__ACENTO2__)

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    # Borde en degradado cian a magenta, como en el tema neón
    col.active_border = $acento $acento2 45deg
    col.inactive_border = $fondo
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 0.96
    inactive_opacity = 0.9
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = true
        color = rgba(__ACENTO2__cc)
        range = 18
    }
}

animations {
    enabled = true
    bezier = nex, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, nex, slide
    animation = fade, 1, 6, nex
    animation = workspaces, 1, 5, nex, slidevert
}
